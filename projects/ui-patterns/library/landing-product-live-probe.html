<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Landing Product Live Probe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --background: oklch(0.141 0.005 285.823);
      --foreground: oklch(0.985 0 0);
      --card: oklch(0.21 0.006 285.885);
      --card-foreground: oklch(0.985 0 0);
      --muted: oklch(0.274 0.006 286.033);
      --muted-foreground: oklch(0.705 0.015 286.067);
      --border: oklch(1 0 0 / 10%);
    }

    body {
      margin: 0;
      font-family: Aptos, "Trebuchet MS", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, rgba(27, 63, 103, 0.45), transparent 42%),
        linear-gradient(180deg, #081018 0%, #050b12 100%);
      color: oklch(0.985 0 0);
    }

    .shell {
      max-width: 1480px;
      margin: 0 auto;
      padding: 32px 20px 80px;
    }

    .hero {
      display: grid;
      gap: 20px;
      grid-template-columns: 1.15fr 0.85fr;
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.34);
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(2.6rem, 6vw, 5rem);
      line-height: 0.94;
      letter-spacing: -0.05em;
    }

    .hero p {
      margin: 0;
      color: rgba(237,243,251,.76);
      font-size: 1rem;
      line-height: 1.7;
      max-width: 62ch;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #7cd1ff;
      letter-spacing: 0.24em;
      font-size: 11px;
      text-transform: uppercase;
    }

    .rail {
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .rail-card {
      padding: 16px 18px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.03);
    }

    .rail-card strong {
      display: block;
      margin-bottom: 6px;
      font-size: 1rem;
    }

    .rail-card span {
      display: block;
      color: rgba(237,243,251,.66);
      font-size: .93rem;
      line-height: 1.5;
    }

    .stack {
      display: grid;
      gap: 24px;
      margin-top: 28px;
    }

    .section-frame {
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,.08);
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.018));
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
    }

    .section-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(124,209,255,.12), transparent 38%);
      pointer-events: none;
    }

    .section-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 16px 18px;
      border-bottom: 1px solid rgba(255,255,255,.07);
      background: rgba(5,11,18,.45);
      backdrop-filter: blur(16px);
    }

    .section-meta strong {
      font-size: .95rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #90d8ff;
    }

    .section-meta span {
      color: rgba(237,243,251,.68);
      font-size: .92rem;
    }

    .section-body {
      padding: 8px;
    }

    .cta-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      color: white;
      font-weight: 600;
      text-decoration: none;
    }

    .cta-button:hover {
      background: rgba(124,209,255,.14);
      border-color: rgba(124,209,255,.34);
    }

    @media (max-width: 960px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .shell {
        padding-inline: 14px;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="env,react">
    const cn = (...inputs) => inputs.filter(Boolean).join(" ");

    const LandingProductPilotProgram = React.forwardRef(
      ({ className, title = "Structure the pilot before anyone asks for proof", description, phases, action, ...props }, ref) => {
        return (
          <section ref={ref} className={cn("w-full py-12 lg:py-16", className)} {...props}>
            <div className="mx-auto flex w-full max-w-6xl flex-col gap-8 px-6">
              <div className="flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
                <div className="flex flex-col gap-3">
                  <h2 className="text-3xl font-semibold tracking-tight md:text-4xl">{title}</h2>
                  {description ? (
                    <p className="max-w-2xl text-base text-[oklch(0.705_0.015_286.067)] md:text-lg">{description}</p>
                  ) : null}
                </div>
                {action ? <div className="shrink-0">{action}</div> : null}
              </div>

              <div className="grid gap-4 lg:grid-cols-3">
                {phases.map((phase, index) => (
                  <article key={phase.title} className="rounded-2xl border border-[oklch(1_0_0_/_10%)] bg-[oklch(0.21_0.006_285.885)] p-6 shadow-sm">
                    <div className="flex items-start justify-between gap-3">
                      <div className="flex h-10 w-10 items-center justify-center rounded-full border border-[oklch(1_0_0_/_10%)] bg-[oklch(0.141_0.005_285.823)] text-sm font-semibold">
                        {index + 1}
                      </div>
                      {phase.duration ? (
                        <span className="text-xs font-medium uppercase tracking-[0.2em] text-[oklch(0.705_0.015_286.067)]">
                          {phase.duration}
                        </span>
                      ) : null}
                    </div>
                    <h3 className="mt-4 text-base font-semibold tracking-tight">{phase.title}</h3>
                    {phase.goal ? <p className="mt-2 text-sm leading-6 text-[oklch(0.705_0.015_286.067)]">{phase.goal}</p> : null}
                    {phase.outputs?.length ? (
                      <ul className="mt-4 grid gap-2">
                        {phase.outputs.map((output) => (
                          <li key={output} className="rounded-xl border border-[oklch(1_0_0_/_10%)] bg-[rgba(255,255,255,.03)] px-4 py-3 text-sm text-[oklch(0.705_0.015_286.067)]">
                            {output}
                          </li>
                        ))}
                      </ul>
                    ) : null}
                  </article>
                ))}
              </div>
            </div>
          </section>
        );
      }
    );

    const LandingProductPricingControls = React.forwardRef(
      ({ className, title = "Show pricing governance instead of just list price", description, controls, ...props }, ref) => {
        return (
          <section ref={ref} className={cn("w-full py-12 lg:py-16", className)} {...props}>
            <div className="mx-auto flex w-full max-w-6xl flex-col gap-8 px-6">
              <div className="flex flex-col gap-3">
                <h2 className="text-3xl font-semibold tracking-tight md:text-4xl">{title}</h2>
                {description ? <p className="max-w-2xl text-base text-[oklch(0.705_0.015_286.067)] md:text-lg">{description}</p> : null}
              </div>

              <div className="grid gap-4 lg:grid-cols-3">
                {controls.map((control) => (
                  <article key={control.title} className="rounded-2xl border border-[oklch(1_0_0_/_10%)] bg-[oklch(0.21_0.006_285.885)] p-6 shadow-sm">
                    <div className="flex items-start justify-between gap-3">
                      <h3 className="text-base font-semibold tracking-tight">{control.title}</h3>
                      {control.impact ? <div className="text-xs uppercase tracking-[0.2em] text-[oklch(0.705_0.015_286.067)]">{control.impact}</div> : null}
                    </div>
                    {control.owner ? <div className="mt-2 text-sm text-[oklch(0.705_0.015_286.067)]">{control.owner}</div> : null}
                    {control.description ? <p className="mt-3 text-sm leading-6 text-[oklch(0.705_0.015_286.067)]">{control.description}</p> : null}
                  </article>
                ))}
              </div>
            </div>
          </section>
        );
      }
    );

    const LandingProductRegionalRollout = React.forwardRef(
      ({ className, title = "Scale rollout by region instead of one blunt launch", description, items, ...props }, ref) => {
        return (
          <section ref={ref} className={cn("w-full py-12 lg:py-16", className)} {...props}>
            <div className="mx-auto flex w-full max-w-6xl flex-col gap-8 px-6">
              <div className="flex flex-col gap-3">
                <h2 className="text-3xl font-semibold tracking-tight md:text-4xl">{title}</h2>
                {description ? <p className="max-w-2xl text-base text-[oklch(0.705_0.015_286.067)] md:text-lg">{description}</p> : null}
              </div>
              <div className="grid gap-4 lg:grid-cols-3">
                {items.map((item) => (
                  <article key={item.region} className="rounded-2xl border border-[oklch(1_0_0_/_10%)] bg-[oklch(0.21_0.006_285.885)] p-6 shadow-sm">
                    <div className="flex items-start justify-between gap-3">
                      <h3 className="text-lg font-semibold tracking-tight">{item.region}</h3>
                      <div className="text-right text-xs uppercase tracking-[0.2em] text-[oklch(0.705_0.015_286.067)]">
                        {item.timing ? <div>{item.timing}</div> : null}
                        {item.sponsor ? <div className="mt-1">{item.sponsor}</div> : null}
                      </div>
                    </div>
                    {item.description ? <p className="mt-3 text-sm leading-6 text-[oklch(0.705_0.015_286.067)]">{item.description}</p> : null}
                  </article>
                ))}
              </div>
            </div>
          </section>
        );
      }
    );

    const App = () => {
      return (
        <div className="shell dark">
          <section className="hero">
            <div className="flex flex-col gap-6">
              <div>
                <p className="eyebrow">Live Rendering Probe</p>
                <h1>Actual components, not poster fakes.</h1>
              </div>
              <p>
                This page renders real LandingProduct React sections in-browser from the stash workspace. It is the smallest viable proof that the shelf can move from inventory theater to actual component preview.
              </p>
            </div>
            <div className="rail">
              <div className="rail-card">
                <strong>What is real here</strong>
                <span>The JSX and section logic are the actual component structures, rendered by React in the browser.</span>
              </div>
              <div className="rail-card">
                <strong>What is still missing</strong>
                <span>This probe uses hand-fed sample props for representative sections. The next step is wiring gallery cards into this live runtime.</span>
              </div>
              <div className="rail-card">
                <strong>Why this matters</strong>
                <span>It proves the archive can be explored as UI, not just filenames or synthetic placeholders.</span>
              </div>
            </div>
          </section>

          <div className="stack">
            <section className="section-frame">
              <div className="section-meta">
                <strong>Pilot Program</strong>
                <span>Enterprise Buying chapter</span>
              </div>
              <div className="section-body">
                <LandingProductPilotProgram
                  title="Pilot program architecture"
                  description="Show the operating shape of the pilot before the buyer asks how success will actually be measured."
                  phases={[
                    { title: "Decision framing", duration: "Week 1", goal: "Lock executive success criteria and boundary conditions.", outputs: ["Success memo", "Risk register", "Named sponsors"] },
                    { title: "Operational embed", duration: "Weeks 2-4", goal: "Put the workflow inside the actual team rhythm instead of a demo bubble.", outputs: ["Runbook", "Owner matrix", "Instrumentation plan"] },
                    { title: "Proof handoff", duration: "Week 5", goal: "Convert results into procurement-ready proof for the next committee.", outputs: ["Outcomes review", "Expansion narrative", "Board-ready summary"] },
                  ]}
                  action={<a className="cta-button" href="./landing-product-gallery.html">Back to gallery</a>}
                />
              </div>
            </section>

            <section className="section-frame">
              <div className="section-meta">
                <strong>Pricing Controls</strong>
                <span>Enterprise Buying chapter</span>
              </div>
              <div className="section-body">
                <LandingProductPricingControls
                  title="Pricing controls"
                  description="Prove the commercial model can be governed, not just sold."
                  controls={[
                    { title: "Usage guardrails", impact: "Margin", owner: "RevOps + Finance", description: "Alert before overage patterns turn pilot goodwill into surprise billing." },
                    { title: "Approval lanes", impact: "Control", owner: "Deal Desk", description: "Define who can discount, who can extend terms, and who signs off on exceptions." },
                    { title: "Renewal triggers", impact: "Expansion", owner: "CS Leadership", description: "Tie commercial motion to adoption thresholds instead of calendar hope." },
                  ]}
                />
              </div>
            </section>

            <section className="section-frame">
              <div className="section-meta">
                <strong>Regional Rollout</strong>
                <span>Adoption and Operations chapter</span>
              </div>
              <div className="section-body">
                <LandingProductRegionalRollout
                  title="Regional rollout plan"
                  description="Roll out by sponsor strength, readiness, and support coverage instead of blasting every market at once."
                  items={[
                    { region: "North America", timing: "Wave 1", sponsor: "VP Operations", description: "Baseline market with deepest support coverage and fastest feedback loop." },
                    { region: "EMEA", timing: "Wave 2", sponsor: "Regional GM", description: "Launch after playbook localization and partner enablement are validated." },
                    { region: "APAC", timing: "Wave 3", sponsor: "Expansion Lead", description: "Stage the rollout behind support hours, documentation maturity, and implementation readiness." },
                  ]}
                />
              </div>
            </section>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
