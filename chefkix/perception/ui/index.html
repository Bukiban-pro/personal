<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChefKix Perception Phase 1</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1220;
      --panel: #111a2e;
      --accent: #7dd3fc;
      --text: #e5eefb;
      --muted: #93a4bf;
      --border: #24304a;
    }
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: radial-gradient(circle at top, #13203d, var(--bg));
      color: var(--text);
    }
    .shell {
      display: grid;
      grid-template-columns: 360px 1fr;
      min-height: 100vh;
    }
    .panel {
      padding: 24px;
      background: rgba(17, 26, 46, 0.9);
      border-right: 1px solid var(--border);
    }
    .canvas-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .stack {
      display: grid;
      gap: 12px;
    }
    label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
    input, select, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #0d1728;
      color: var(--text);
    }
    button { cursor: pointer; background: linear-gradient(135deg, #1d4ed8, #06b6d4); border: none; font-weight: 700; }
    .card {
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      background: rgba(13, 23, 40, 0.75);
    }
    canvas {
      max-width: min(100%, 980px);
      border-radius: 18px;
      border: 1px solid var(--border);
      background: #08101d;
    }
    .muted { color: var(--muted); font-size: 14px; }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      color: #cfe8ff;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="panel">
      <div class="stack">
        <div>
          <h1>ChefKix Phase 1</h1>
          <p class="muted">Standalone ingredient perception smoke demo.</p>
        </div>
        <div class="card">
          <label for="file">Image</label>
          <input id="file" type="file" accept="image/*" />
        </div>
        <div class="card">
          <label for="labelHint">Label hint</label>
          <select id="labelHint">
            <option value="">Auto / filename</option>
            <option value="egg">egg</option>
            <option value="tomato">tomato</option>
            <option value="onion">onion</option>
            <option value="garlic">garlic</option>
            <option value="chicken">chicken</option>
            <option value="beef">beef</option>
            <option value="potato">potato</option>
            <option value="carrot">carrot</option>
            <option value="lettuce">lettuce</option>
            <option value="milk_carton">milk_carton</option>
            <option value="butter">butter</option>
            <option value="lemon">lemon</option>
          </select>
        </div>
        <button id="run">Run inference</button>
        <div class="card">
          <label>Response</label>
          <pre id="response">Upload a file and run inference.</pre>
        </div>
      </div>
    </aside>
    <main class="canvas-wrap">
      <canvas id="canvas" width="960" height="720"></canvas>
    </main>
  </div>

  <script>
    const fileInput = document.getElementById('file');
    const labelHint = document.getElementById('labelHint');
    const responseBox = document.getElementById('response');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let currentImage = null;

    function drawBaseImage(image) {
      const scale = Math.min(canvas.width / image.width, canvas.height / image.height);
      const width = image.width * scale;
      const height = image.height * scale;
      const x = (canvas.width - width) / 2;
      const y = (canvas.height - height) / 2;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#08101d';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(image, x, y, width, height);
      return { x, y, width, height, scale };
    }

    function drawDetections(imageBounds, detections) {
      detections.forEach((det) => {
        const [x1, y1, x2, y2] = det.bbox;
        const x = imageBounds.x + x1 * imageBounds.scale;
        const y = imageBounds.y + y1 * imageBounds.scale;
        const width = (x2 - x1) * imageBounds.scale;
        const height = (y2 - y1) * imageBounds.scale;
        ctx.strokeStyle = '#7dd3fc';
        ctx.lineWidth = 3;
        ctx.strokeRect(x, y, width, height);
        ctx.fillStyle = 'rgba(8, 16, 29, 0.9)';
        ctx.fillRect(x, Math.max(0, y - 24), Math.max(120, width), 24);
        ctx.fillStyle = '#e5eefb';
        ctx.font = '16px Inter, sans-serif';
        ctx.fillText(`${det.class_name} ${(det.score * 100).toFixed(1)}%`, x + 6, Math.max(18, y - 7));
      });
    }

    async function runInference() {
      const file = fileInput.files[0];
      if (!file) {
        responseBox.textContent = 'Choose an image first.';
        return;
      }
      const formData = new FormData();
      formData.append('file', file);
      if (labelHint.value) {
        formData.append('label_hint', labelHint.value);
      }
      const response = await fetch('http://127.0.0.1:8000/infer', { method: 'POST', body: formData });
      const payload = await response.json();
      responseBox.textContent = JSON.stringify(payload, null, 2);

      const image = new Image();
      image.onload = () => {
        currentImage = drawBaseImage(image);
        drawDetections(currentImage, payload.detections || []);
      };
      image.src = URL.createObjectURL(file);
    }

    document.getElementById('run').addEventListener('click', runInference);
  </script>
</body>
</html>
